<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <rect width="720" height="360" fill="#1b1f2a"/>
  <rect x="0" y="0" width="720" height="360" fill="#1b1f2a"/>
  <!-- settings section header -->
  <text x="24" y="42" font-family="sans-serif" font-size="20" fill="#e5e9f0">Isolated wrapvm desktop VM</text>
  <text x="24" y="66" font-family="sans-serif" font-size="13" fill="#9aa3b2">Agent work runs inside a wrapvm desktop container; this panel controls the VM and shows its desktop viewer.</text>
  <!-- status rows -->
  <text x="24" y="96" font-family="sans-serif" font-size="12" fill="#9aa3b2">Status</text>
  <text x="150" y="96" font-family="sans-serif" font-size="12" fill="#e5e9f0">Running</text>
  <text x="24" y="118" font-family="sans-serif" font-size="12" fill="#9aa3b2">Image</text>
  <text x="150" y="118" font-family="sans-serif" font-size="12" fill="#e5e9f0">ghcr.io/tobi/wrapvm:desktop</text>
  <text x="24" y="140" font-family="sans-serif" font-size="12" fill="#9aa3b2">Container</text>
  <text x="150" y="140" font-family="sans-serif" font-size="12" fill="#e5e9f0">wrapvm-isolate</text>
  <text x="24" y="162" font-family="sans-serif" font-size="12" fill="#9aa3b2">Viewer URL</text>
  <text x="150" y="162" font-family="sans-serif" font-size="12" fill="#e5e9f0">http://127.0.0.1:6080</text>
  <!-- viewer iframe placeholder -->
  <rect x="24" y="184" width="672" height="130" rx="4" fill="#111419" stroke="#2f3747" stroke-width="1"/>
  <text x="360" y="254" font-family="sans-serif" font-size="12" fill="#6b7485" text-anchor="middle">noVNC viewer iframe</text>
  <!-- controls -->
  <rect x="24" y="326" width="90" height="26" rx="4" fill="#2a4d8f"/>
  <text x="69" y="344" font-family="sans-serif" font-size="12" fill="#e5e9f0" text-anchor="middle">Start VM</text>
  <rect x="122" y="326" width="90" height="26" rx="4" fill="#3a3f4d"/>
  <text x="167" y="344" font-family="sans-serif" font-size="12" fill="#e5e9f0" text-anchor="middle">Stop VM</text>
  <rect x="220" y="326" width="90" height="26" rx="4" fill="#3a3f4d"/>
  <text x="265" y="344" font-family="sans-serif" font-size="12" fill="#e5e9f0" text-anchor="middle">Refresh</text>
</svg>
